name: Makefile CI

on:
  push:
    branches: [ "ums9620_2h10_native-user-13-TP1A.220624.014-20251218.102134-release-keys" ]
  pull_request:
    branches: [ "ums9620_2h10_native-user-13-TP1A.220624.014-20251218.102134-release-keys" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: configure
      run: ./configure

    - name: Install dependencies
      run: make

    - name: Run check
      run: make check

    - name: Run distcheck
      run: make distcheck
